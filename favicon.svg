<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Apocalypse 666">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2"/>
      <feOffset dx="0" dy="0" result="offsetblur"/>
      <feFlood flood-color="#fca5a5" flood-opacity="0.85"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#fecaca" stroke-opacity="0.35" stroke-width="1"/>
  <g filter="url(#glow)">
    <text x="32" y="32"
          text-anchor="middle"
          dominant-baseline="central"
          font-family="Cinzel, Georgia, 'Times New Roman', serif"
          font-size="24"
          font-weight="700"
          letter-spacing="-1"
          fill="#ffffff">666</text>
  </g>
</svg>